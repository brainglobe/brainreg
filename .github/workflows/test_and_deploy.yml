name: Allen 3.1 clean atlas audit
jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
    - uses: neuroinformatics-unit/actions/lint@v2
  manifest:
    name: Check manifest
    runs-on: ubuntu-latest
    steps:
    - uses: neuroinformatics-unit/actions/check_manifest@v2
  test:
    needs:
    - linting
    - manifest
    name: ${{ matrix.os }} py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        python-version:
        - '3.12'
        - '3.13'
        - '3.14'
        include:
        - os: windows-latest
          python-version: '3.14'
    steps:
    - name: 'Audit: start with empty atlas storage'
      shell: python {0}
      run: "from pathlib import Path\nimport shutil\nfor name in (\".brainglobe\", \".brainglobe-tests\"):\n    root = Path.home() / name\n    if root.exists():\n        shutil.rmtree(root)\n    assert not root.exists(), root\n    print(f\"EMPTY_ATLAS_STORAGE {root}\", flush=True)\n"
    - name: Run tests
      uses: neuroinformatics-unit/actions/test-uv@34bedfdfd70c6010be02182c9ca37fae8a1fd99d
      with:
        python-version: ${{ matrix.python-version }}
        secret-codecov-token: ${{ secrets.CODECOV_TOKEN }}
        install-extras: dev,napari
        use-headless: 'true'
    - name: 'Audit: verify downloaded Allen atlas is 3.1'
      if: always()
      shell: python {0}
      run: "from pathlib import Path\nimport json\nimport re\nfound = []\nfor name in (\".brainglobe\", \".brainglobe-tests\"):\n    for manifest in (Path.home() / name).rglob(\"manifest.json\"):\n        atlas_name = manifest.parent.parent.name\n        if re.fullmatch(r\"allen_mouse_\\d+um\", atlas_name):\n            record = {\"atlas\": atlas_name, \"version\": manifest.parent.name.replace(\"_\", \".\"), \"manifest\": str(manifest)}\n            print(\"ALLEN_ATLAS_AUDIT \" + json.dumps(record), flush=True)\n            found.append(record)\nassert all(item[\"version\"] == \"3.1\" for item in found), found\nif not found:\n    print(\"ALLEN_ATLAS_AUDIT no Allen manifest found; this job does not establish Allen coverage\", flush=True)\n"
  test-with-conda:
    needs:
    - linting
    - manifest
    name: Test conda-install, on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - macos-latest
        - windows-latest
    steps:
    - name: 'Audit: start with empty atlas storage'
      shell: python {0}
      run: "from pathlib import Path\nimport shutil\nfor name in (\".brainglobe\", \".brainglobe-tests\"):\n    root = Path.home() / name\n    if root.exists():\n        shutil.rmtree(root)\n    assert not root.exists(), root\n    print(f\"EMPTY_ATLAS_STORAGE {root}\", flush=True)\n"
    - name: Checkout repository
      uses: actions/checkout@v3
    - name: Setup mamba environment
      uses: mamba-org/setup-micromamba@v2
      with:
        init-shell: bash
        environment-name: niftyreg-env
        create-args: python=3.14 setuptools setuptools_scm wheel
    - name: Install package into environment
      shell: bash -el {0}
      run: 'pip install .[dev]

        '
    - name: Run backend tests (no conda binaries)
      shell: bash -el {0}
      run: 'pytest -v -p no:pytest-qt tests/tests/test_backend

        '
    - name: Install niftyreg with conda
      shell: bash -el {0}
      run: 'micromamba install niftyreg

        '
    - name: Run backend tests(conda binaries present)
      shell: bash -el {0}
      run: 'pytest -v -p no:pytest-qt tests/tests/test_backend

        '
    - name: 'Audit: verify downloaded Allen atlas is 3.1'
      if: always()
      shell: python {0}
      run: "from pathlib import Path\nimport json\nimport re\nfound = []\nfor name in (\".brainglobe\", \".brainglobe-tests\"):\n    for manifest in (Path.home() / name).rglob(\"manifest.json\"):\n        atlas_name = manifest.parent.parent.name\n        if re.fullmatch(r\"allen_mouse_\\d+um\", atlas_name):\n            record = {\"atlas\": atlas_name, \"version\": manifest.parent.name.replace(\"_\", \".\"), \"manifest\": str(manifest)}\n            print(\"ALLEN_ATLAS_AUDIT \" + json.dumps(record), flush=True)\n            found.append(record)\nassert all(item[\"version\"] == \"3.1\" for item in found), found\nif not found:\n    print(\"ALLEN_ATLAS_AUDIT no Allen manifest found; this job does not establish Allen coverage\", flush=True)\n"
'on':
  workflow_dispatch: null
